services:
  postgres:
    image: postgres:15
    container_name: ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger321}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ledger} -d $${POSTGRES_DB:-ledger_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-engine
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledger_db}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger321}
      POSTGRES_DB: ${POSTGRES_DB:-ledger_db}
      JWT_SECRET: ${JWT_SECRET:-6f3ded5605c6fe63c18f5734e3728ca8}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: